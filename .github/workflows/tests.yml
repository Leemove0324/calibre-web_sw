# F9 (#11): main으로 가는 PR과 main push마다 단위 테스트와 M10 커버리지 검사를 돌린다.
# 실제 외부 API는 부르지 않는다 (녹화 응답 사용). 따라서 API 키가 필요 없다.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -v --cov --cov-report=term --cov-report=json:coverage.json

      - name: Check M10 coverage of new modules
        run: python scripts/check_coverage.py coverage.json | tee coverage-m10.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.json
            coverage-m10.txt
          if-no-files-found: ignore
